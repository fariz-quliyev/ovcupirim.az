<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="cursor:pointer; display:flex; flex-direction:column; height:100%" onClick="{{ item.onOpen }}">
  <div style="position:relative; aspect-ratio:4/3; border-radius:6px; overflow:hidden; background:#E9E5DC; background-image:repeating-linear-gradient(135deg, rgba(32,37,34,.045) 0 1px, transparent 1px 9px); display:flex; align-items:center; justify-content:center">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#BEB6A4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"></path></svg>
    <button type="button" aria-label="Favorit" onClick="{{ item.onFav }}" style="position:absolute; top:8px; right:8px; width:32px; height:32px; border:none; border-radius:50%; background:rgba(255,255,255,.86); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0" style-hover="background:#FFFFFF">
      <svg width="17" height="17" viewBox="0 0 24 24" stroke="{{ item.favStroke }}" fill="{{ item.favFill }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
    </button>
    <sc-if value="{{ item.badge }}" hint-placeholder-val="{{ true }}">
      <span style="position:absolute; bottom:8px; left:8px; font:600 12px/1 Inter, sans-serif; padding:6px 9px; border-radius:4px; color:#FFFFFF; background:{{ item.badgeBg }}">{{ item.badge }}</span>
    </sc-if>
  </div>
  <div style="padding:10px 2px 0; display:flex; flex-direction:column; gap:6px; flex:1">
    <div style="font:700 17px/1.2 Manrope, sans-serif; color:#202522; letter-spacing:-.01em">{{ item.priceText }}</div>
    <div style="font:400 14px/1.4 Inter, sans-serif; color:#202522; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-wrap:pretty">{{ item.t }}</div>
    <div style="margin-top:auto; padding-top:8px; display:flex; align-items:center; justify-content:space-between; gap:8px">
      <span style="font:400 13px/1.3 Inter, sans-serif; color:#6C7268">{{ item.metaText }}</span>
      <sc-if value="{{ item.promoted }}" hint-placeholder-val="{{ true }}">
        <span style="display:flex; align-items:center; gap:5px; flex-shrink:0">
          <svg width="15" height="13" viewBox="0 0 24 24" fill="#FF5A1F" stroke="none"><path d="M3 6l4.5 3.5L12 3l4.5 6.5L21 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path></svg>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#C4441F" stroke="none"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
        </span>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:330},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
