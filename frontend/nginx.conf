# OvcuPrim.az — production edge: serves the built SPA, proxies the API, and serves uploaded media
# directly from the persistent volume the API writes to. One server block, one origin — the
# frontend and the API share it, so the browser never makes a cross-origin request and the
# refresh-token cookie never needs SameSite=None.
#
# `server_name` is intentionally a catch-all: the real domain is a deployment fact (like
# AllowedHosts on the API side), not something to guess here. Replace `_` with the real hostname(s)
# — and add the commented HTTPS server block below — once a certificate exists for it.

server {
    listen 80;
    server_name _;

    # Docker Compose's own embedded DNS, always at this address on a user-defined bridge network
    # (the `ovcuprim` network in docker-compose.prod.yml) — not a guessed or invented address.
    # Combined with the $upstream_api variable below, this makes `api`'s hostname resolve lazily,
    # per request, instead of once when nginx starts. Without it, nginx resolves `proxy_pass
    # http://api:8080` exactly once at startup and never again: `docker compose restart web`
    # alone works fine either way, but restarting or redeploying only `api` afterwards changes its
    # container IP, and a static proxy_pass would keep sending traffic to the old one until `web`
    # itself is also restarted. This is also why `nginx -t` can validate this file with no live
    # network at all (`docker run --rm <image> nginx -t`) instead of failing to resolve `api`.
    resolver 127.0.0.11 valid=10s;

    # Comfortably above the API's own per-upload limit (ListingMediaService.MaxBytesPerImage,
    # 5 MiB, plus a small multipart-overhead allowance — see [RequestSizeLimit] on the upload
    # actions) so nginx never rejects a request the API would otherwise accept. One file per
    # request, never all ten of a listing's images at once, so this does not need to be 10x larger.
    client_max_body_size 10m;

    # Baseline hardening. Deliberately no Content-Security-Policy: this app loads Google Fonts and
    # inline styles from Tailwind's runtime, and a CSP tight enough to matter needs to be tuned
    # against the actual asset origins rather than guessed at deployment time.
    #
    # Applies here to /api/ and /health below, which set no add_header of their own. The three
    # locations that do (to set their own Cache-Control) repeat this same include, on purpose —
    # see security-headers.conf's own comment for why a location-level add_header needs it.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/javascript
        application/xml text/xml image/svg+xml;

    # ---- API -------------------------------------------------------------------------------
    # Both the versioned surface and the two standalone paths MapHealthChecks/HealthController
    # expose outside the /api/v1 prefix (see backend/src/Ovcuprim.Api/Program.cs).

    # Never reachable through this public proxy, in any environment. The API itself only maps
    # these under ASPNETCORE_ENVIRONMENT=Development or Staging (see backend/src/Ovcuprim.Api/
    # Program.cs) — reading anyone's OTP by phone number and completing a fake payment for any
    # order id — and a real production host never sets either, so this block is the actual
    # enforcement for Staging specifically: the routes exist there so a verifier with direct
    # container access (`docker exec ... curl`) can drive them, but the internet never sees them.
    # Longest-prefix match wins in nginx regardless of file order, so this takes precedence over
    # the general /api/ block below on its own — this comment is the only reason it comes first.
    location /api/v1/dev/ {
        return 404;
    }

    location /api/ {
        set $upstream_api http://api:8080;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API only trusts these from a proxy it has been told about — see
        # ForwardedHeaders:KnownNetworks in docker-compose.prod.yml, which must name this
        # container's own network or every visitor is metered as one caller.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No WebSocket upgrade headers: nothing on this API uses one, and adding the headers for a
        # protocol the app never speaks is exactly the unnecessary-infrastructure this deployment
        # avoids elsewhere.
    }

    # Readiness (includes the database) — see docs/production-runbook.md §3.
    location = /health {
        set $upstream_api http://api:8080;
        proxy_pass $upstream_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Uploaded media ----------------------------------------------------------------------
    # Served straight off the shared volume rather than proxied through the API — the concrete
    # form of "production serves it from the CDN" in LocalFileStorage's own remarks, until an
    # actual object-storage/CDN decision is made. Matches Storage:Local:PublicBaseUrl = "/uploads".
    # Mounted read-only here (see docker-compose.prod.yml); nginx never writes to it.
    location /uploads/ {
        alias /data/uploads/;
        autoindex off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # A missing file answers 404 from nginx directly rather than falling through to the SPA's
        # index.html, which `location /` below would otherwise do for any unmatched path.
        try_files $uri =404;
    }

    # ---- The SPA -----------------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets (Vite fingerprints every filename in dist/assets) can be cached forever;
    # index.html itself must always be revalidated so a deploy is visible on the next load.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# ---- HTTPS ------------------------------------------------------------------------------------
# Commented out on purpose: this repository does not invent a production hostname or ship a
# certificate. Two ways to add TLS, pick one:
#
#   1. Terminate here. Obtain a certificate for the real domain (e.g. certbot), mount it into this
#      container (e.g. at /etc/nginx/certs/), set `server_name` above to the real hostname, and
#      uncomment the block below — it repeats every location from the HTTP server so nothing has
#      to be duplicated by hand later.
#
#   2. Terminate upstream (a cloud load balancer, or another reverse proxy in front of this one).
#      In that case leave this file as it is and forward its own X-Forwarded-* headers unchanged;
#      ForwardedHeaders:KnownNetworks/KnownProxies on the API must then name that upstream instead
#      of this container.
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name ovcuprim.az www.ovcuprim.az;  # replace with the real domain(s)
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#
#     # ... the same client_max_body_size, security headers, and location blocks as above ...
# }
#
# server {
#     listen 80;
#     server_name ovcuprim.az www.ovcuprim.az;
#     return 301 https://$host$request_uri;
# }
