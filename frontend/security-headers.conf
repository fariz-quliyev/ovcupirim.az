# Included by name (not inherited) inside every location in nginx.conf that sets its own
# Cache-Control via add_header — nginx drops every add_header a location's parent (server) block
# set the moment that location adds even one of its own, so these have to be repeated exactly
# where a location does that, not just declared once at server level.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
