services:
  postgres:
    image: postgres:16-alpine
    container_name: ovcuprim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ovcuprim}
      POSTGRES_USER: ${POSTGRES_USER:-ovcuprim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ovcuprim_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ovcuprim} -d ${POSTGRES_DB:-ovcuprim}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
